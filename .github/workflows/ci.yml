name: CI

# Déclenchement manuel (onglet Actions → CI → Run workflow) : pas de minutes consommées à chaque push.
# Pour l'activer à chaque push : remplacer par  on: { push: { branches: [main] }, pull_request: {} }
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            relay/package-lock.json
      - run: npm ci --prefix ../relay
      - run: npm ci
      - run: npm run typecheck
      - name: Test d'intégration (relais + hôte + client)
        run: npm test
      - name: Test E2E (relais + deux vrais VS Code)
        run: xvfb-run -a npm run test:e2e
      - run: npx vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension/*.vsix
