name: Release

# Alternative CI au script local `npm run release` (voir docs/RELEASING.md).
# Déclenchement manuel : Actions → Release → Run workflow, en indiquant un tag vX.Y.Z déjà poussé.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à publier (ex. v0.3.0), déjà poussé'
        required: true

permissions:
  contents: write

env:
  GITHUB_REF_NAME: ${{ inputs.tag }}

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Le tag correspond à la version du package
        run: |
          V=$(node -p "require('./package.json').version")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME ≠ version v$V de package.json"; exit 1; }
      - run: npm ci --prefix ../relay
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: xvfb-run -a npm run test:e2e
      - run: npm run package
      - name: Notes de version depuis CHANGELOG.md
        run: |
          V=${GITHUB_REF_NAME#v}
          awk -v v="$V" '$0 ~ "^## \[?"v"\]?" {f=1; next} /^## / {f=0} f' ../CHANGELOG.md > ../notes.md
          [ -s ../notes.md ] || echo "Version $V" > ../notes.md
      - name: Créer la release GitHub avec le .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --notes-file ../notes.md
